<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Store</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  <header class="bg-purple-700 p-4 text-white">
    <h1 class="text-xl font-bold">Sound Store</h1>
  </header>
  <main class="mx-auto mt-8 max-w-sm rounded-lg border border-gray-200">
    <img src="./img/photo.webp" class="aspect-video w-full rounded-t-lg bg-white object-contain" alt="Бездротові навушники">
    <div class="p-4">
      <span class="rounded bg-purple-100 px-2 py-1 text-sm text-purple-800">Новинка</span>
      <h2 class="mt-3 text-2xl font-bold">Бездротові навушники</h2>
      <p class="mt-2">
        <span class="text-gray-500 line-through">2 499 грн</span>
        <span class="ml-2 font-bold text-purple-700">1 999 грн</span>
      </p>
      <button class="mt-4 rounded bg-purple-700 px-4 py-2 text-white" type="button">В кошик</button>
    </div>
  </main>
</body>
</html>
